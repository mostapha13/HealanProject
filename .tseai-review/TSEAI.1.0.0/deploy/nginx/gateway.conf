resolver 127.0.0.11 valid=5s ipv6=off;
upstream tseai_api { zone tseai_api 64k; server tseai-api:8080 resolve; }
upstream identity_api { zone identity_api 64k; server identity-api:8080 resolve; }
upstream notification_api { zone notification_api 64k; server notification-api:8080 resolve; }
upstream web_ui { zone web_ui 64k; server web:80 resolve; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_hide_header Server;

    # Identity has its own namespace; /identity/api/auth/... -> /api/auth/...
    location /identity/ {
        client_max_body_size 256k;
        proxy_pass http://identity_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications/ {
        client_max_body_size 256k;
        proxy_pass http://notification_api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No trailing slash on proxy_pass: preserve /api/... expected by TSEAI.Api.
    location /api/ {
        proxy_pass http://tseai_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { proxy_pass http://web_ui/; proxy_set_header Host $host; }
}
