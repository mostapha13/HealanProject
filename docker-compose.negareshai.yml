services:
  negareshai-redis:
    image: redis:7-alpine
    container_name: negareshai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - negareshai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [negareshai]

  negareshai-api:
    build:
      context: .
      dockerfile: Backend/NegareshAI/Dockerfile
    container_name: negareshai-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NegareshAI: "Server=${NEGARESHAI_SQL_SERVER:-host.docker.internal,1433};Database=${NEGARESHAI_SQL_DATABASE:-NegareshAI};User Id=sa;Password=${NEGARESHAI_SQL_PASSWORD:?Set NEGARESHAI_SQL_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "negareshai-redis:6379"
      Authentication__Authority: "${NEGARESHAI_IDENTITY_URL:-http://host.docker.internal:5005}"
      Identity__UserManagerBaseUrl: "${NEGARESHAI_USERMANAGER_URL:-http://host.docker.internal:5074/}"
      Tenancy__DevelopmentOrganizationId: "${NEGARESHAI_DEVELOPMENT_ORGANIZATION_ID:-11111111-1111-1111-1111-111111111111}"
      FileManager__BaseUrl: "${NEGARESHAI_FILEMANAGER_URL:-http://host.docker.internal:6823/}"
      Ai__BaseUrl: "http://negareshai-ai:8000/"
      Cors__AllowedOrigins__0: "${NEGARESHAI_WEB_ORIGIN:-http://localhost:3000}"
    ports:
      - "6129:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [negareshai]
    depends_on:
      negareshai-redis:
        condition: service_healthy

  negareshai-ai:
    build:
      context: .
      dockerfile: AI/NegareshAI/Dockerfile
    container_name: negareshai-ai
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_TELEMETRY: "FALSE"
      SENTENCE_TRANSFORMERS_HOME: "/models"
      HF_HOME: "/models"
      MODEL_OFFLINE: "${NEGARESHAI_MODEL_OFFLINE:-true}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OCR_LANGUAGES: "${NEGARESHAI_OCR_LANGUAGES:-fas+eng}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - negareshai-chroma:/data/chroma
      - negareshai-models:/models
    networks: [negareshai]

  negareshai-web:
    build:
      context: Frontend/negareshai
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEGARESHAI_PUBLIC_API_URL:-http://localhost:6129}"
        NEXT_PUBLIC_IDENTITY_BASE_URL: "${NEGARESHAI_PUBLIC_IDENTITY_URL:-http://localhost:5005}"
        NEXT_PUBLIC_USER_MANAGER_BASE_URL: "${NEGARESHAI_PUBLIC_USER_MANAGER_URL:-http://localhost:5074}"
    container_name: negareshai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      negareshai-api:
        condition: service_healthy
      negareshai-ai:
        condition: service_healthy
    networks: [negareshai]

networks:
  negareshai:
    name: negareshai

volumes:
  negareshai-chroma:
  negareshai-models:
  negareshai-redis-data:
