services:
  negareshai-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: negareshai-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${NEGARESHAI_SQL_PASSWORD:?Set NEGARESHAI_SQL_PASSWORD}"
    ports:
      - "14330:1433"
    volumes:
      - negareshai-sql:/var/opt/mssql
    networks: [negareshai]

  negareshai-api:
    build:
      context: .
      dockerfile: Backend/NegareshAI/Dockerfile
    container_name: negareshai-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NegareshAI: "Server=negareshai-db;Database=NegareshAI;User Id=sa;Password=${NEGARESHAI_SQL_PASSWORD:?Set NEGARESHAI_SQL_PASSWORD};TrustServerCertificate=True"
      Authentication__Authority: "http://identity-server:8080"
    ports:
      - "6129:8080"
    depends_on: [negareshai-db]
    networks: [negareshai]

  negareshai-ai:
    build:
      context: .
      dockerfile: AI/NegareshAI/Dockerfile
    container_name: negareshai-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - negareshai-chroma:/data/chroma
    networks: [negareshai]

  negareshai-web:
    build:
      context: Frontend/negareshai
      dockerfile: Dockerfile
    container_name: negareshai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on: [negareshai-ai]
    networks: [negareshai]

networks:
  negareshai:
    name: negareshai

volumes:
  negareshai-chroma:
  negareshai-sql:
